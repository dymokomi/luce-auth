# What the gate runs on each platform (luce-base tools/gate.py, docs/CI.md): bash commands
# in this checkout, in order, beside its dependencies at main, with LUCE_BASE and LUCE
# naming the toolchain the gate built.
tools = ["luce"]

[macos]
steps = [
    # the gate's compilers where tools/bootstrap.py would build them
    "mkdir -p build/toolchain && cp \"$LUCE_BASE\" \"$LUCE\" build/toolchain/",
    "python3 tests/run.py --mode all",
]
full = [
    "python3 tests/sanitize.py --base build/toolchain/luce-base",
    # full-cost password hashing contention
    "python3 tests/admission_modes.py",
    # native leak detection
    "python3 tests/heap.py",
    "python3 tests/test_heap_process.py",
]

[linux]
steps = [
    # the gate's compilers where tools/bootstrap.py would build them
    "mkdir -p build/toolchain && cp \"$LUCE_BASE\" \"$LUCE\" build/toolchain/",
    "python3 tests/run.py --mode all",
]
full = [
    "python3 tests/sanitize.py --base build/toolchain/luce-base",
    "python3 tests/admission_modes.py",
    "python3 tests/test_heap_process.py",
]

[windows]
steps = [
    # the gate's compilers where tools/bootstrap.py would build them
    "mkdir -p build/toolchain && cp \"$LUCE_BASE\" \"$LUCE\" build/toolchain/",
    "python tests/run.py --mode all",
]
